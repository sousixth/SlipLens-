name: Build Unsigned iOS IPA (For Sideloadly / AltStore)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    name: Build Unsigned SlipLens.ipa on macOS
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen & Generate Xcode Project
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build Unsigned iOS App Bundle
        run: |
          xcodebuild build \
            -project SlipLens.xcodeproj \
            -scheme SlipLens \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into SlipLens-Unsigned.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SlipLens.app Payload/
          zip -r9 SlipLens-Unsigned.ipa Payload

      - name: Upload SlipLens-Unsigned.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlipLens-Unsigned-IPA
          path: SlipLens-Unsigned.ipa
          if-no-files-found: error
          retention-days: 30
