name: SlipLens
options:
  bundleIdPrefix: com.sliplens
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SlipLens:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SlipLens
        excludes:
          - Info.plist
    info:
      path: SlipLens/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliplens.tracker
        INFOPLIST_FILE: SlipLens/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
