name: SlipLens
options:
  bundleIdPrefix: com.sliplens
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SlipLens:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SlipLens
        excludes:
          - Info.plist
    info:
      path: SlipLens/Info.plist
      properties:
        CFBundleDevelopmentRegion: th
        CFBundleDisplayName: SlipLens
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        NSPhotoLibraryUsageDescription: "SlipLens ต้องการเข้าถึงคลังรูปภาพของคุณเพื่อสแกนสลิปโอนเงิน ใบเสร็จ และสลิปเงินเดือนประจำเดือน โดยประมวลผลบนอุปกรณ์ 100%"
        NSPhotoLibraryAddUsageDescription: "SlipLens ต้องการสิทธิ์ในการเข้าถึงรูปภาพเพื่อจัดการสลิปของคุณ"
        NSCameraUsageDescription: "SlipLens ต้องการใช้กล้องเพื่อสแกนสลิปโอนเงินและใบเสร็จ"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliplens.tracker
        INFOPLIST_FILE: SlipLens/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
